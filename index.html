<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebRTC Studio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23e5484d'/%3E%3Ccircle cx='16' cy='16' r='7' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/studio.css">
</head>
<body class="studio">
  <header class="topbar">
    <div class="brand"><span class="brand-dot"></span>WebRTC Studio</div>
    <div class="top-status" id="topStatus"></div>
    <div class="top-right">
      <span id="saveState" class="muted small"></span>
      <span id="clock" class="clock mono"></span>
    </div>
  </header>
  <div id="alerts" class="alerts"></div>
  <main class="layout">
    <section class="monitors" id="monitors"></section>
    <section class="multiview-wrap panel" id="multiview"></section>
    <section class="mixer panel" id="mixer"></section>
    <aside class="side panel" id="side"></aside>
  </main>
  <noscript>WebRTC Studio needs JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
